<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="model-viewer.min.js"></script>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; background: #f5f7fa; }
      model-viewer { width: 100%; height: 100%; opacity: 1; transition: opacity 125ms ease; }
      #label { position: fixed; bottom: 12px; left: 0; right: 0; text-align: center; font: 16px sans-serif; color: #202124; }
    </style>
  </head>
  <body>
    <model-viewer id="avatar" camera-controls interaction-prompt="none"></model-viewer>
    <div id="label" aria-live="polite">Loading avatar...</div>
    <script>
      const avatar = document.getElementById('avatar');
      const label = document.getElementById('label');
      let crossfadeMs = 250;
      let activeClip = null;

      function send(type, details = {}) {
        SignBridge.postMessage(JSON.stringify({ type, ...details }));
      }

      avatar.addEventListener('load', () => send('ready'));
      avatar.addEventListener('error', (event) => {
        send('error', { message: event.detail?.source || 'Could not load avatar.glb.' });
      });
      avatar.addEventListener('finished', () => {
        const clip = activeClip;
        activeClip = null;
        send('clipEnded', { clip });
      });

      window.setCrossfadeDuration = (milliseconds) => {
        crossfadeMs = Math.max(0, milliseconds);
      };

      window.setModelFile = (file) => {
        avatar.src = file;
      };

      window.playClip = async (name) => {
        if (!avatar.loaded) {
          send('error', { message: 'Avatar model is not loaded.' });
          return;
        }
        if (!avatar.availableAnimations.includes(name)) {
          send('error', { message: `Animation "${name}" is not in avatar.glb.` });
          return;
        }
        avatar.style.opacity = '0';
        await new Promise((resolve) => setTimeout(resolve, crossfadeMs / 2));
        avatar.pause();
        avatar.animationName = name;
        avatar.currentTime = 0;
        activeClip = name;
        label.textContent = name.replaceAll('-', ' ');
        avatar.play();
        requestAnimationFrame(() => { avatar.style.opacity = '1'; });
      };

      window.stopPlayback = () => {
        activeClip = null;
        avatar.pause();
        label.textContent = '';
      };

    </script>
  </body>
</html>
